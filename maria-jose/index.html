<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis 15 Años · María José</title>
  <meta name="description" content="Invitación a los 15 años de María José · Sábado 07 de noviembre de 2026">
  <meta property="og:title" content="Mis 15 Años · María José">
  <meta property="og:description" content="Sábado 07 de noviembre de 2026 · 7:00 pm · Ruby Campestre">
  <meta property="og:image" content="Fotos-Maria/00.jpg.jpeg">
  <meta name="theme-color" content="#2b2118">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #b8955f;
      --gold-dark: #8c6a3a;
      --rose: #f09a9c;
      --rose-soft: #fdf1f1;
      --ink: #1d1a17;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: #2b2118 radial-gradient(ellipse at top, #4a3a2c 0%, #1c1510 70%) fixed;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--ink);
      min-height: 100vh;
    }

    .invitacion {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      box-shadow: 0 0 60px rgba(0, 0, 0, .55);
    }

    /* Cada sección es una imagen; los elementos se posicionan en % sobre ella */
    .seccion {
      position: relative;
      container-type: inline-size;
      line-height: 0;
    }

    .seccion img {
      display: block;
      width: 100%;
      height: auto;
    }

    .capa {
      position: absolute;
      line-height: normal;
    }

    /* Aparición suave al hacer scroll */
    .revelar {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity .9s ease, transform .9s ease;
    }
    .revelar.visible { opacity: 1; transform: none; }

    /* ---------- Imagen 01: reproductor ---------- */
    .reproductor {
      /* recuadro rosado: x 188–986, y 581–756 sobre 1181×974 */
      left: 17.2%;
      top: 60.9%;
      width: 65.6%;
      height: 15.6%;
      display: flex;
      align-items: center;
      gap: 4cqw;
      padding: 0 4.5cqw;
    }

    .btn-play {
      flex: none;
      width: 10.5cqw;
      height: 10.5cqw;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background: linear-gradient(145deg, #f6b3b4, #e2797c);
      box-shadow: 0 .6cqw 1.8cqw rgba(214, 104, 108, .45), inset 0 .3cqw .4cqw rgba(255, 255, 255, .45);
      display: grid;
      place-items: center;
      position: relative;
      transition: transform .2s ease;
    }
    .btn-play:hover { transform: scale(1.06); }
    .btn-play:active { transform: scale(.95); }
    .btn-play svg { width: 42%; height: 42%; fill: #fff; }
    .btn-play .ico-pause { display: none; }
    .sonando .btn-play .ico-play { display: none; }
    .sonando .btn-play .ico-pause { display: block; }

    /* halo que late mientras no suena, invitando a tocar */
    .btn-play::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: .35cqw solid var(--rose);
      animation: halo 2s ease-out infinite;
    }
    .sonando .btn-play::after { animation: none; opacity: 0; }

    @keyframes halo {
      0%   { transform: scale(1);   opacity: .8; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    .pista {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.3cqw;
      min-width: 0;
    }

    .pista-titulo {
      font-size: 3.4cqw;
      font-style: italic;
      color: #7a5a5b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .barra {
      position: relative;
      height: 1.1cqw;
      border-radius: 1cqw;
      background: #f3cfd0;
      cursor: pointer;
    }
    .barra-progreso {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #f2a5a7, #d96e72);
    }
    .barra-progreso::after {
      content: "";
      position: absolute;
      right: -1.1cqw;
      top: 50%;
      width: 2.2cqw;
      height: 2.2cqw;
      border-radius: 50%;
      background: #fff;
      border: .35cqw solid #d96e72;
      transform: translateY(-50%);
    }

    .tiempos {
      display: flex;
      justify-content: space-between;
      font-size: 2.7cqw;
      color: #9a7b7c;
    }

    .ecualizador {
      display: flex;
      align-items: flex-end;
      gap: .5cqw;
      height: 3.4cqw;
      flex: none;
    }
    .ecualizador span {
      width: .8cqw;
      height: 30%;
      background: #e2797c;
      border-radius: .4cqw;
    }
    .sonando .ecualizador span { animation: eq 1s ease-in-out infinite; }
    .ecualizador span:nth-child(2) { animation-delay: -.3s; }
    .ecualizador span:nth-child(3) { animation-delay: -.6s; }
    .ecualizador span:nth-child(4) { animation-delay: -.15s; }
    @keyframes eq {
      0%, 100% { height: 25%; }
      50%      { height: 100%; }
    }

    /* ---------- Imagen 03: contador ---------- */
    .contador {
      /* recuadro translúcido, encima de las etiquetas Días / Horas / Minutos / Segundos */
      left: 0;
      top: 85.8%;
      width: 100%;
      height: 7%;
    }
    .contador .num {
      position: absolute;
      top: 0;
      width: 20%;
      transform: translateX(-50%);
      text-align: center;
      font-weight: 500;
      font-size: 8.6cqw;
      line-height: 1;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    /* centros de cada etiqueta medidos sobre 1181 px */
    .num.dias     { left: 10.4%; }
    .num.horas    { left: 31.0%; }
    .num.minutos  { left: 55.4%; }
    .num.segundos { left: 83.0%; }

    .num.tic { animation: tic .45s ease; }
    @keyframes tic {
      0%   { transform: translateX(-50%) translateY(-12%); opacity: .3; }
      100% { transform: translateX(-50%) translateY(0);    opacity: 1; }
    }

    /* ---------- Botones invisibles ---------- */
    .zona-clic {
      display: block;
      border-radius: 1cqw;
      transition: background-color .25s ease, box-shadow .25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .zona-clic:hover,
    .zona-clic:focus-visible {
      background-color: rgba(184, 149, 95, .12);
      box-shadow: 0 0 0 .4cqw rgba(184, 149, 95, .35);
      outline: none;
    }
    .zona-clic:active { background-color: rgba(184, 149, 95, .22); }

    /* Imagen 05: "Ir al mapa" — x 397–781, y 582–708 sobre 1181×1772 */
    .btn-mapa {
      left: 33.6%;
      top: 32.8%;
      width: 32.6%;
      height: 7.2%;
      animation: brillo 2.6s ease-in-out infinite;
    }

    /* Imagen 06: "Cuenta con mi presencia" — x 173–1005, y 993–1176 */
    .btn-whatsapp {
      left: 14.6%;
      top: 56.0%;
      width: 70.5%;
      height: 10.4%;
      border-radius: 999px;
      animation: brillo 2.6s ease-in-out infinite;
    }

    @keyframes brillo {
      0%, 100% { box-shadow: 0 0 0 0 rgba(184, 149, 95, 0); }
      50%      { box-shadow: 0 0 0 1cqw rgba(184, 149, 95, .22); }
    }

    /* ---------- Botón flotante de música ---------- */
    .musica-flotante {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      width: 52px;
      height: 52px;
      border: 2px solid rgba(255, 255, 255, .8);
      border-radius: 50%;
      background: linear-gradient(145deg, #f6b3b4, #d96e72);
      box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
      cursor: pointer;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(.7);
      transition: opacity .3s ease, transform .3s ease;
    }
    .musica-flotante.mostrar { opacity: 1; pointer-events: auto; transform: scale(1); }
    .musica-flotante svg { width: 24px; height: 24px; fill: #fff; }
    .sonando .musica-flotante svg { animation: girar 4s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .revelar { opacity: 1; transform: none; transition: none; }
      .btn-play::after, .btn-mapa, .btn-whatsapp,
      .sonando .ecualizador span, .sonando .musica-flotante svg,
      .num.tic { animation: none; }
    }
  </style>
</head>
<body>
  <main class="invitacion" id="invitacion">

    <section class="seccion">
      <img src="Fotos-Maria/00.jpg.jpeg" alt="Mis 15 Años · María José" width="1181" height="1772">
    </section>

    <section class="seccion revelar" id="musica">
      <img src="Fotos-Maria/01.jpg.jpeg" alt="Dale play a mi canción y déjate llevar por esta melodía que dará inicio a una noche llena de magia y sueños" width="1181" height="974">
      <div class="capa reproductor">
        <button class="btn-play" id="btnPlay" type="button" aria-label="Reproducir canción">
          <svg class="ico-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
          <svg class="ico-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
        </button>
        <div class="pista">
          <div class="pista-titulo">Mi canción especial</div>
          <div class="barra" id="barra" role="slider" aria-label="Progreso de la canción" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="barra-progreso" id="progreso"></div>
          </div>
          <div class="tiempos"><span id="tActual">0:00</span><span id="tTotal">0:00</span></div>
        </div>
        <div class="ecualizador" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      </div>
    </section>

    <section class="seccion revelar">
      <img src="Fotos-Maria/02.jpg.jpeg" alt="Hoy mi corazón se viste de sueños y mis ojos brillan con la ilusión de una nueva etapa" width="1181" height="1772" loading="lazy">
    </section>

    <section class="seccion revelar">
      <img src="Fotos-Maria/03.jpg.jpeg" alt="Solo faltan" width="1181" height="1772" loading="lazy">
      <div class="capa contador" aria-live="polite">
        <span class="num dias" id="cDias">00</span>
        <span class="num horas" id="cHoras">00</span>
        <span class="num minutos" id="cMinutos">00</span>
        <span class="num segundos" id="cSegundos">00</span>
      </div>
    </section>

    <section class="seccion revelar">
      <img src="Fotos-Maria/04.jpg.jpeg" alt="¿Cuándo y dónde? Sábado 07 de noviembre de 2026, 7:00 pm" width="1181" height="1772" loading="lazy">
    </section>

    <section class="seccion revelar">
      <img src="Fotos-Maria/05.jpg.jpeg" alt="Ruby Campestre · Código de vestimenta: Elegante" width="1181" height="1772" loading="lazy">
      <a class="capa zona-clic btn-mapa"
         href="https://www.google.com/maps?q=6.446974754333496,-75.72074127197266&z=17&hl=es"
         target="_blank" rel="noopener" aria-label="Ir al mapa de Ruby Campestre"></a>
    </section>

    <section class="seccion revelar">
      <img src="Fotos-Maria/06.jpg.jpeg" alt="Confirmar asistencia · Lluvia de sobres" width="1181" height="1772" loading="lazy">
      <a class="capa zona-clic btn-whatsapp" id="btnWhatsapp"
         href="#" target="_blank" rel="noopener" aria-label="Confirmar asistencia por WhatsApp"></a>
    </section>

    <section class="seccion revelar">
      <img src="Fotos-Maria/07.jpg.jpeg" alt="Los mejores momentos de la vida merecen ser compartidos. Gracias por acompañarme" width="1181" height="1772" loading="lazy">
    </section>

  </main>

  <button class="musica-flotante" id="btnFlotante" type="button" aria-label="Pausar o reanudar la música">
    <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
  </button>

  <audio id="audio" src="audio/cancion.mp3" preload="metadata" loop></audio>

  <script>
    // ---------- WhatsApp ----------
    const telefono = '573144619636';
    const mensaje = 'He recibido tu invitación y confirmo mi asistencia. Espero con ilusión compartir contigo una noche llena de magia, sonrisas y recuerdos inolvidables. ✨🎉';
    document.getElementById('btnWhatsapp').href =
      'https://wa.me/' + telefono + '?text=' + encodeURIComponent(mensaje);

    // ---------- Música ----------
    const audio = document.getElementById('audio');
    const btnPlay = document.getElementById('btnPlay');
    const btnFlotante = document.getElementById('btnFlotante');
    const barra = document.getElementById('barra');
    const progreso = document.getElementById('progreso');
    const tActual = document.getElementById('tActual');
    const tTotal = document.getElementById('tTotal');

    const formato = s => {
      if (!isFinite(s)) return '0:00';
      const m = Math.floor(s / 60);
      return m + ':' + String(Math.floor(s % 60)).padStart(2, '0');
    };

    function alternar() {
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    }

    btnPlay.addEventListener('click', alternar);
    btnFlotante.addEventListener('click', alternar);

    audio.addEventListener('play', () => {
      document.body.classList.add('sonando');
      btnFlotante.classList.add('mostrar');
      btnPlay.setAttribute('aria-label', 'Pausar canción');
    });
    audio.addEventListener('pause', () => {
      document.body.classList.remove('sonando');
      btnPlay.setAttribute('aria-label', 'Reproducir canción');
    });
    audio.addEventListener('loadedmetadata', () => { tTotal.textContent = formato(audio.duration); });
    audio.addEventListener('timeupdate', () => {
      const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      progreso.style.width = pct + '%';
      barra.setAttribute('aria-valuenow', Math.round(pct));
      tActual.textContent = formato(audio.currentTime);
    });

    barra.addEventListener('click', e => {
      if (!audio.duration) return;
      const r = barra.getBoundingClientRect();
      audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
    });
    barra.addEventListener('keydown', e => {
      if (!audio.duration) return;
      if (e.key === 'ArrowRight') audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
      if (e.key === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
    });

    // ---------- Contador: sábado 7 de noviembre de 2026, 7:00 pm (hora Colombia) ----------
    const fechaEvento = new Date('2026-11-07T19:00:00-05:00').getTime();
    const celdas = {
      dias: document.getElementById('cDias'),
      horas: document.getElementById('cHoras'),
      minutos: document.getElementById('cMinutos'),
      segundos: document.getElementById('cSegundos')
    };

    function poner(el, valor) {
      const texto = String(valor).padStart(2, '0');
      if (el.textContent !== texto) {
        el.textContent = texto;
        el.classList.remove('tic');
        void el.offsetWidth;
        el.classList.add('tic');
      }
    }

    function actualizarContador() {
      const resto = Math.max(0, fechaEvento - Date.now());
      const s = Math.floor(resto / 1000);
      poner(celdas.dias, Math.floor(s / 86400));
      poner(celdas.horas, Math.floor((s % 86400) / 3600));
      poner(celdas.minutos, Math.floor((s % 3600) / 60));
      poner(celdas.segundos, s % 60);
    }
    actualizarContador();
    setInterval(actualizarContador, 1000);

    // ---------- Aparición al hacer scroll ----------
    const observador = new IntersectionObserver(entradas => {
      entradas.forEach(en => {
        if (en.isIntersecting) {
          en.target.classList.add('visible');
          observador.unobserve(en.target);
        }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll('.revelar').forEach(el => observador.observe(el));
  </script>
</body>
</html>
